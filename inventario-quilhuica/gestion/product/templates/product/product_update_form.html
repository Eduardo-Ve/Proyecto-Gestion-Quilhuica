{% extends 'base/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<h2>Editar Producto: {{ object.name_prod }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-3">Actualizar</button>
    <a href="{% url 'product:product_list' %}" class="btn btn-secondary mt-3">Cancelar</a>
</form>
{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static '/form_style.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/toggle_form_fields.js' %}"></script>
{% endblock %}
