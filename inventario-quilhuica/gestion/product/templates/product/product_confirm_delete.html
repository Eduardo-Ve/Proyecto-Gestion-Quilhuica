{% extends 'base/base.html' %}

{% block content %}
<h2>Eliminar Producto</h2>
<p>¿Deseas eliminar el producto <strong>{{ object.name_prod }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'product:product_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
