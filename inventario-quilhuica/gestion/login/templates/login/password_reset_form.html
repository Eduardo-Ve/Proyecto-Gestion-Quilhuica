{% extends 'base/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 500px; border-radius: 15px;">
        <div class="card-body">
            <h2 class="text-center mb-4" style="color: #1E1E1E;">Restablecer contraseña</h2>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid">
                    <button type="submit" class="btn btn-success" 
                            style="background-color: #00C451; border-color: #055526;">
                        Guardar nueva contraseña
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
