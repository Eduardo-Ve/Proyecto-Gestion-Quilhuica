{% block title %}Correo enviado{% endblock %}
{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height:70vh;">
  <div class="card p-4 text-center shadow-sm" style="max-width:500px;width:100%;border:none;">
    <div class="mb-3">
      <!-- Icono de sobre -->
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#00C853" class="bi bi-envelope-check mb-3" viewBox="0 0 16 16">
        <path d="M2 2a2 2 0 0 0-2 2v.217l8 4.8 8-4.8V4a2 2 0 0 0-2-2H2Z"/>
        <path d="M0 6.383v7.634A2 2 0 0 0 2 16h8.293a5.42 5.42 0 0 1-.274-1H2a1 1 0 0 1-1-1V6.383l7.555 4.528a.5.5 0 0 0 .495 0L14 6.383v2.69c.35.05.687.133 1 .247V6.383l-7.555 4.528a1.5 1.5 0 0 1-1.49 0L0 6.383Z"/>
        <path d="M15.854 10.146a.5.5 0 0 0-.708 0L13 12.293l-.646-.647a.5.5 0 0 0-.708.708l1 1a.5.5 0 0 0 .708 0l2.5-2.5a.5.5 0 0 0 0-.708Z"/>
      </svg>
    </div>

    <h2 class="fw-bold mb-3" style="color:#00C853;">¡Correo enviado!</h2>
    <p class="text-muted mb-4">
      Si tu correo está registrado, recibirás un enlace para restablecer tu contraseña.
    </p>
    <a href="{% url 'login' %}" 
       class="btn btn-success btn-lg w-100" 
       style="background:#00C853;border:none;">
      Volver al inicio de sesión
    </a>
  </div>
</div>
{% endblock %}
