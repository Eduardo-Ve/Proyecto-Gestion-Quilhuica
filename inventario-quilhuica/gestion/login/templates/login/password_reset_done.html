{% extends "base/base.html" %}
{% block title %}Contraseña restablecida{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center password-reset" style="min-height:70vh;">
  <div class="card p-4 text-center" style="max-width:500px;width:100%;">
    <h2 class="fw-bold text-success mb-3">✅ Contraseña actualizada</h2>
    <p class="text-muted mb-4">Tu contraseña ha sido cambiada correctamente. Ya puedes iniciar sesión.</p>
    <a href="{% url 'login' %}" class="btn btn-success px-4">Ir al inicio de sesión</a>
  </div>
</div>
{% endblock %}
