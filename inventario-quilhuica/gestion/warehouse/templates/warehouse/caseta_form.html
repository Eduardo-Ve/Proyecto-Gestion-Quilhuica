{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 class="mb-4">{{ title }}</h1>

    <form method="post" class="card p-4 shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <!-- Se añade diseño temporal hardcodeado al html -->
        <button type="submit" class="btn btn-success" style="background-color: #00C451; border-radius: 50px; cursor: pointer; transition: all 0.3s
ease 0s;
">Guardar</button>
        <a href="{% url 'warehouse:caseta_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
