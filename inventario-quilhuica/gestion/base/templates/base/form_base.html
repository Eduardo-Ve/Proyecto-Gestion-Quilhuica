{% extends "base/base.html" %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static '/form_global.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* Animación al cerrar */
.alert.fade-out {
  opacity: 0;
  transform: scale(0.97);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
</style>
{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">

  <form method="post" novalidate>
    {% csrf_token %}
    {% block form_content %}{% endblock %}
    <div class="text-end mt-4">
      <button type="submit" class="btn btn-success px-4">{{ submit_text|default:"Guardar" }}</button>
      {% if cancel_url %}
      <a href="{{ cancel_url }}" class="btn btn-secondary px-4">Cancelar</a>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<!-- Sin depender de bootstrap.bundle -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  //  Cerrar alerta al hacer clic en la X
  document.querySelectorAll(".alert-close-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      const alert = e.target.closest(".alert");
      if (alert) {
        alert.classList.add("fade-out");
        setTimeout(() => alert.remove(), 250);
      }
    });
  });

  //  Cierre automático a los 5 segundos
  document.querySelectorAll(".alert").forEach(alert => {
    setTimeout(() => {
      alert.classList.add("fade-out");
      setTimeout(() => alert.remove(), 250);
    }, 5000);
  });
});
</script>
{% endblock %}
