{% extends "core/base.html" %}
{% block title %}Producto{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Editar{% else %}Nuevo{% endif %} producto</h1>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="row g-3">
    {{ form.as_p }}
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-outline-secondary" href="{% url 'core:producto_list' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
